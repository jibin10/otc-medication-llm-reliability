[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otc-medication-llm-reliability"
version = "0.1.0"
description = "OTC drug-name ambiguity and active-ingredient verification research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.3,<2",
    "pandas>=2.3,<4",
    "requests>=2.32,<3",
    "ijson>=3.4,<4",
    "rapidfuzz==3.14.3",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
